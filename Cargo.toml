[package]
name = "gswitch"
version = "0.1.0"
edition = "2024"
description = "GPU switching utility for NVIDIA Optimus laptops"
authors = ["gswitch contributors"]
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
match_like_matches_macro = "allow"
match_same_arms = "allow"
single_match = "allow"

[lints.rust]
# unsafe_code = "allow"  — removed: no unsafe usage remains